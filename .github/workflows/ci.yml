name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4-alpine
        env: { POSTGRES_USER: tur, POSTGRES_PASSWORD: tur, POSTGRES_DB: tur_test }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U tur" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt pip-audit
      - run: cp .env.example .env
      - run: python -m pytest -q
      - run: pip-audit -r requirements.txt || true  # relatório; não bloqueia enquanto não houver política definida

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high || true
